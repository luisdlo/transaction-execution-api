services:

  postgres:
    image: postgres:16-alpine
    container_name: spin-postgres
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions
      POSTGRES_PASSWORD: transactions
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # La app no debe arrancar antes de que Postgres acepte conexiones,
      # o Flyway falla al intentar migrar.
      test: ["CMD-SHELL", "pg_isready -U transactions -d transactions"]
      interval: 5s
      timeout: 3s
      retries: 10

  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: spin-wiremock
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    command: ["--global-response-templating", "--verbose"]

  app:
    build: .
    container_name: spin-app
    depends_on:
      postgres:
        # No arrancamos la app antes de que Postgres acepte conexiones:
        # Flyway abre conexión al inicio y truena si la BD no está lista.
        condition: service_healthy
      wiremock:
        # WireMock no tiene healthcheck; con service_started basta —
        # el circuito abierto/timeouts los maneja el propio cliente HTTP
        # si WireMock tarda en estar listo para tráfico.
        condition: service_started
    environment:
      # Dentro de la red de compose, los hosts son los nombres de servicio
      # y los puertos son los INTERNOS del contenedor (no los publicados).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/transactions
      SPRING_DATASOURCE_USERNAME: transactions
      SPRING_DATASOURCE_PASSWORD: transactions
      # WireMock escucha en 8080 dentro del container; en el host se expone
      # como 8081 pero la app NO usa el host, usa el nombre del servicio.
      PROVIDER_BASE_URL: http://wiremock:8080
    ports:
      - "8080:8080"

volumes:
  postgres-data:

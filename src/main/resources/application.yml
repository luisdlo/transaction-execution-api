spring:
  application:
    name: transaction-execution-api

  # El servicio es I/O-bound: una llamada HTTP bloqueante por transaccion.
  # Con platform threads el pool satura alrededor de 200 concurrentes.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/transactions
    username: transactions
    password: transactions
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  # Permite terminar los requests en vuelo durante un rolling update.
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui

# ---------------------------------------------------------------------------
# Proveedor externo
# ---------------------------------------------------------------------------
provider:
  base-url: http://localhost:8081
  connect-timeout: 1s
  read-timeout: 3s

# ---------------------------------------------------------------------------
# Reglas de negocio. Externalizadas para poder ajustar limites sin recompilar.
# ---------------------------------------------------------------------------
transaction:
  rules:
    minimum-amount: 1.00
    debit-max-amount: 10000.00
    supported-currency: MXN

logging:
  level:
    com.spin.transactions: DEBUG
